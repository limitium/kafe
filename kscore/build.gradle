plugins {
    id 'application'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

ext {
    set('springCloudVersion', "2025.1.4")
}

dependencies {
    implementation 'org.apache.kafka:kafka-streams'
    implementation 'org.apache.kafka:connect-api'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.cloud:spring-cloud-stream'
    implementation 'org.springframework.cloud:spring-cloud-stream-binder-kafka'
    implementation 'org.springframework.cloud:spring-cloud-stream-binder-kafka-streams'

    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    implementation "com.google.code.gson:gson"


    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.easymock:easymock:5.7.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation project(":sequencer")
    implementation project(":ksmodel")
}

springBoot {
    mainClass = 'art.limitium.kafe.kscore.KStreamApplication'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
